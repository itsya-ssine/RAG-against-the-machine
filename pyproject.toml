[project]
name = "RAG-against-the-machine"
version = "0.1.0"
description = "Retrieval-Augmented Generation system over a codebase, using BM25/TF-IDF retrieval and Qwen3-0.6B for answer generation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "fire>=0.6.0",
    "tqdm>=4.66.0",
    "rank-bm25>=0.2.2",
    "transformers>=4.44.0",
    "torch>=2.3.0",
    "types-tqdm>=4.70.0.20260906",
]

[dependency-groups]
dev = [
    "flake8>=7.0.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
